# The suites on a Mac and on Windows, which nothing here has: run by hand (Actions -> platforms -> Run
# workflow, which runs every job), or by pushing a commit to a branch named for the platform, which runs
# that platform's jobs only -- `git push -f origin HEAD:macos-ci`, `git push -f origin HEAD:windows-ci` --
# never on every push to main. The repository is public (2026-09-25), so the minutes are free; a run is
# about 20 minutes on the Mac and longer on Windows, where every pool worker starts by spawn.
#
# Three ways in, as docs/install.md gives them to a tester:
#   suites     macOS, Python from setup-python (as python.org's), `pip install ".[gui]"`, then the six
#              suites that need no video data, the windows on the runner's own desktop.
#   homebrew   macOS, Homebrew's Python, whose pip refuses outside a venv, in a venv as install.md says;
#              `mcdonald setup`, and the launcher and window can start.
#   windows    Windows, Python from setup-python (as python.org's or winget's), ffmpeg from Chocolatey
#              (install.md says winget; the same build), the same six suites on the runner's desktop.
# Each job's output is pushed to the branch ci-logs (logs/<run>/<job>/), so that it can be read
# with git alone: `git fetch origin ci-logs && git show origin/ci-logs:logs/...`.
name: platforms
on:
  workflow_dispatch:
  push:
    branches: [macos-ci, windows-ci]

permissions:
  contents: write                   # the logs, to ci-logs

jobs:
  suites:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos-ci'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: brew install ffmpeg
      - name: install
        run: python -m pip install ".[gui,dev]"
      - name: mcdonald setup
        run: |
          mkdir -p out
          { uname -a; sw_vers; sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu; } > out/machine.txt 2>&1
          rc=0; mcdonald setup > out/setup.txt 2>&1 || rc=$?; echo "exit $rc" >> out/setup.txt     # recorded, not fatal: the suites come next
          cat out/setup.txt
      - name: the suites
        run: |
          failed=""
          for s in test_reduction test_published test_tether test_cli test_measurement test_gui; do
            echo "== $s  $(date +%H:%M:%S)"
            t0=$SECONDS
            python -u tests/$s.py > out/$s.log 2>&1 || failed="$failed $s"
            echo "$s $((SECONDS - t0)) s" >> out/times.txt
            echo "   $((SECONDS - t0)) s, $(grep -c '  PASS' out/$s.log) PASS, $(grep -c '  FAIL' out/$s.log) FAIL, $(grep -c '  SKIP' out/$s.log) SKIP"
            grep -E '  (FAIL|SKIP)' out/$s.log | cut -c1-200 || true
            tail -3 out/$s.log
          done
          echo "${failed:-none}" > out/failed.txt
          [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }
      - name: logs to ci-logs
        if: always()
        uses: ./.github/actions/push-logs
        with:
          job: suites

  homebrew:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos-ci'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew's Python and ffmpeg
        run: brew install python ffmpeg
      - name: install as docs/install.md says
        run: |
          mkdir -p out
          PY=$(brew --prefix)/bin/python3
          { $PY --version; $PY -m pip install . 2>&1 | tail -3; echo "(pip outside a venv: exit ${PIPESTATUS[0]})"; } > out/install.txt 2>&1
          $PY -m venv ~/mcdonald-env
          ~/mcdonald-env/bin/pip install ".[gui]" >> out/install.txt 2>&1
          echo "venv install: exit $?" >> out/install.txt
          cat out/install.txt
      - name: mcdonald setup, and the launcher starts
        run: |
          source ~/mcdonald-env/bin/activate
          mcdonald setup > out/setup.txt 2>&1; echo "exit $?" >> out/setup.txt
          mcdonald --help > out/help.txt 2>&1; echo "exit $?" >> out/help.txt
          # the documents come with the install, not from the repository
          for d in "" method agents install; do mcdonald readme $d | head -3; echo "readme $d: exit ${PIPESTATUS[0]}, $(mcdonald readme $d | wc -l) lines"; done > out/readme.txt 2>&1
          # the window, up for a few seconds and then closed: it opens, or it says why not
          mcdonald-gui > out/gui.txt 2>&1 &
          pid=$!
          sleep 15
          screencapture -x out/gui.png || true
          if kill $pid 2>/dev/null; then echo "still up after 15 s (opened)" >> out/gui.txt; else echo "ended by itself" >> out/gui.txt; fi
          cat out/setup.txt out/readme.txt out/gui.txt
      - name: logs to ci-logs
        if: always()
        uses: ./.github/actions/push-logs
        with:
          job: homebrew

  windows:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/windows-ci'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash                   # Git's bash, on every Windows runner: the same steps as the Mac's
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      MCDONALD_TEST_PATIENCE: "3"     # test_gui's deadlines, until a run says what the runner needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress --limit-output
      - name: install
        run: python -m pip install ".[gui,dev]"
      - name: mcdonald setup
        run: |
          mkdir -p out
          { python -c "import platform, os; print(platform.platform(), os.cpu_count(), 'cpus')"; ffmpeg -version | head -1; } > out/machine.txt 2>&1
          cat out/machine.txt
          rc=0; mcdonald setup > out/setup.txt 2>&1 || rc=$?; echo "exit $rc" >> out/setup.txt     # recorded, not fatal: the suites come next
          cat out/setup.txt
      - name: the suites
        run: |
          failed=""
          for s in test_reduction test_published test_tether test_cli test_measurement test_gui; do
            echo "== $s  $(date +%H:%M:%S)"
            t0=$SECONDS
            python -u tests/$s.py > out/$s.log 2>&1 || failed="$failed $s"
            echo "$s $((SECONDS - t0)) s" >> out/times.txt
            echo "   $((SECONDS - t0)) s, $(grep -c '  PASS' out/$s.log) PASS, $(grep -c '  FAIL' out/$s.log) FAIL, $(grep -c '  SKIP' out/$s.log) SKIP"
            grep -E '  (FAIL|SKIP)' out/$s.log | cut -c1-200 || true
            tail -3 out/$s.log
          done
          echo "${failed:-none}" > out/failed.txt
          [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }
      - name: logs to ci-logs
        if: always()
        uses: ./.github/actions/push-logs
        with:
          job: windows
