[build-system]
requires = ["setuptools>=77"]          # 77: the licence as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mcdonald"
dynamic = ["version"]                  # mcdonald.__version__, the one place it is written
description = "Measurement tools for single-sensor video of unidentified objects: background layers, clip integrity, symbology, angular scale, kinematics, co-motion"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Haqq Misra", email = "jacob@bmsis.org" }]
keywords = ["uap", "video-forensics", "photogrammetry", "kinematics", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
]

# ffmpeg and ffprobe are also required, and cannot be installed from PyPI.
# mcdonald.clip.require_ffmpeg() checks for them before any run.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=9.5",
    # The window (mcdonald-gui). Everyone gets it with `pip install mcdonald` (Jacob, 2026-09-25):
    # the people who use it have no terminal to add an extra from. Essentials, not the PySide6
    # meta-package: QtCore/QtGui/QtWidgets is all it uses, and the rest is another ~350 MB.
    # PySide6 is LGPL. Do not substitute PyQt, which is GPL or commercial and would decide this
    # package's licence for it.
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Empty since 0.2.5, when the window became a dependency: kept so that `mcdonald[gui]` -- in
# 0.2.1-0.2.4's update commands, and in instructions already sent -- still installs without a warning.
gui = []
# Computing on a graphics card (mcdonald.gpu), never required: CuPy, which runs on NVIDIA cards through CUDA, on Linux
# and Windows. `[ctk]` brings CUDA's own libraries from PyPI (about 2 GB installed), so that only the card's driver has
# to be on the computer. CUDA 12 is the default because it still runs on the cards CUDA 13 dropped (GeForce GTX 900
# and 1000 series: Maxwell, Pascal, Volta) as well as on today's; `gpu-cuda13` is for a computer whose driver and
# libraries are CUDA 13's (cards from the GTX 1600 and RTX 2000 series on). Install one, never both: the two CuPy
# builds are the same module. A computer that has a CUDA toolkit installed already needs only `cupy-cuda12x` or
# `cupy-cuda13x` itself. CuPy needs NumPy 2.
gpu = ["cupy-cuda12x[ctk]>=14"]
gpu-cuda13 = ["cupy-cuda13x[ctk]>=14"]

[project.scripts]
mcdonald = "mcdonald.cli:main"

# The window for someone with no terminal (needs the `gui` extra). A gui-script, so
# that on a desktop it opens no console; `mcdonald-gui --desktop-entry` adds it to the
# applications menu on Linux.
[project.gui-scripts]
mcdonald-gui = "mcdonald.gui:main"

[project.urls]
Homepage = "https://github.com/haqqmisra/mcdonald"
Repository = "https://github.com/haqqmisra/mcdonald"
Documentation = "https://github.com/haqqmisra/mcdonald/blob/main/README-technical.md"
Installing = "https://github.com/haqqmisra/mcdonald/blob/main/docs/install.md"

[tool.setuptools.dynamic]
version = { attr = "mcdonald.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The PURSUE videos' list (tools/ship_catalog.py), so that record ids work without a mirror,
# and the icon (tools/make_icons.py).
[tool.setuptools.package-data]
mcdonald = ["pursue_videos.csv", "controls_beat.csv", "icons/*"]
